<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="630" viewBox="0 0 1440 630">
  <rect width="1440" height="630" fill="#000000"/>

  <!-- Top row: 5 lifecycle stages (purple) -->
  <!-- box width 200, gap ~44, start x=120 -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- Discovery -->
    <rect x="120" y="48" width="220" height="104" rx="14" fill="#4a47a3" stroke="#6f6cc9" stroke-width="1.5"/>
    <text x="230" y="92" fill="#ffffff" font-size="27" font-weight="700">Discovery</text>
    <text x="230" y="124" fill="#c9c7ee" font-size="20">Awareness</text>

    <!-- Pre-sales -->
    <rect x="364" y="48" width="220" height="104" rx="14" fill="#4a47a3" stroke="#6f6cc9" stroke-width="1.5"/>
    <text x="474" y="92" fill="#ffffff" font-size="27" font-weight="700">Pre-sales</text>
    <text x="474" y="124" fill="#c9c7ee" font-size="20">Qualification</text>

    <!-- Purchase -->
    <rect x="608" y="48" width="220" height="104" rx="14" fill="#4a47a3" stroke="#6f6cc9" stroke-width="1.5"/>
    <text x="718" y="92" fill="#ffffff" font-size="27" font-weight="700">Purchase</text>
    <text x="718" y="124" fill="#c9c7ee" font-size="20">Conversion</text>

    <!-- Support -->
    <rect x="852" y="48" width="220" height="104" rx="14" fill="#4a47a3" stroke="#6f6cc9" stroke-width="1.5"/>
    <text x="962" y="92" fill="#ffffff" font-size="27" font-weight="700">Support</text>
    <text x="962" y="124" fill="#c9c7ee" font-size="20">Resolution</text>

    <!-- Retention -->
    <rect x="1096" y="48" width="220" height="104" rx="14" fill="#4a47a3" stroke="#6f6cc9" stroke-width="1.5"/>
    <text x="1206" y="92" fill="#ffffff" font-size="27" font-weight="700">Retention</text>
    <text x="1206" y="124" fill="#c9c7ee" font-size="20">Loyalty</text>
  </g>

  <!-- Dashed connectors from stages down to agent layer -->
  <g stroke="#8a8a8a" stroke-width="1.6" stroke-dasharray="5 6">
    <line x1="230" y1="152" x2="230" y2="192"/>
    <line x1="474" y1="152" x2="474" y2="192"/>
    <line x1="718" y1="152" x2="718" y2="192"/>
    <line x1="962" y1="152" x2="962" y2="192"/>
    <line x1="1206" y1="152" x2="1206" y2="192"/>
  </g>

  <!-- Unified CX Agent Layer (green) -->
  <rect x="120" y="192" width="1196" height="104" rx="12" fill="#0e5a43" stroke="#2f8d6c" stroke-width="1.5"/>
  <text x="718" y="234" fill="#ffffff" font-size="30" font-weight="700" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Unified CX Agent Layer</text>
  <text x="718" y="268" fill="#5fd6a3" font-size="21" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">One vendor &#183; Full lifecycle &#183; Outcome-based</text>

  <!-- Arrows from agent layer down to systems of record -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e0992f"/>
    </marker>
  </defs>
  <g stroke="#8a8a8a" stroke-width="1.8">
    <line x1="262" y1="296" x2="262" y2="346" marker-end="url(#arrow)"/>
    <line x1="568" y1="296" x2="568" y2="346" marker-end="url(#arrow)"/>
    <line x1="872" y1="296" x2="872" y2="346" marker-end="url(#arrow)"/>
    <line x1="1178" y1="296" x2="1178" y2="346" marker-end="url(#arrow)"/>
  </g>

  <!-- Systems of record (gray) -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <!-- CRM -->
    <rect x="120" y="348" width="284" height="92" rx="12" fill="#4a4a4a" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="262" y="388" fill="#ffffff" font-size="26" font-weight="700">CRM</text>
    <text x="262" y="416" fill="#cfcfcf" font-size="19">Customer data</text>

    <!-- Comms -->
    <rect x="426" y="348" width="284" height="92" rx="12" fill="#4a4a4a" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="568" y="388" fill="#ffffff" font-size="26" font-weight="700">Comms</text>
    <text x="568" y="416" fill="#cfcfcf" font-size="19">Email, chat, voice</text>

    <!-- Loyalty -->
    <rect x="730" y="348" width="284" height="92" rx="12" fill="#4a4a4a" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="872" y="388" fill="#ffffff" font-size="26" font-weight="700">Loyalty</text>
    <text x="872" y="416" fill="#cfcfcf" font-size="19">Rewards &amp; points</text>

    <!-- Subscriptions -->
    <rect x="1034" y="348" width="284" height="92" rx="12" fill="#4a4a4a" stroke="#6f6f6f" stroke-width="1.5"/>
    <text x="1176" y="388" fill="#ffffff" font-size="26" font-weight="700">Subscriptions</text>
    <text x="1176" y="416" fill="#cfcfcf" font-size="19">Billing, renewals</text>
  </g>

  <!-- Data flywheel: orange dashed curve from Subscriptions back to CRM -->
  <path d="M 1270 440 C 1270 540, 900 560, 600 552 C 420 547, 300 520, 262 452"
        fill="none" stroke="#e0992f" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arrowOrange)"/>

  <!-- Caption -->
  <text x="718" y="598" fill="#e8e8e8" font-size="23" font-weight="600" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">Data flywheel &#8212; every interaction trains the intelligence layer</text>
</svg>
